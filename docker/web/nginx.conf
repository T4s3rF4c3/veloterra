server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    # Der MapLibre-Worker ist ein ES-Modul (.mjs) – ohne korrekten Typ lädt die Karte nicht
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Weiterleitung zu einem eigenen BRouter-Server (nur wenn BROUTER_UPSTREAM gesetzt ist)
    include /etc/nginx/veloterra/*.conf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Laufzeit-Konfiguration nie cachen
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Service Worker (Offline-Betrieb): immer die neueste Fassung prüfen
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Gebaute Dateien haben Hashes im Namen → lange cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
