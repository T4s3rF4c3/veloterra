# Baut die Container-Images und veröffentlicht sie in der GitHub Container
# Registry (ghcr.io/<besitzer>/veloterra, …/veloterra-brouter und …/veloterra-api).
name: Docker-Images

on:
  push:
    branches: [main]
    tags: ['v*']
  # Pull Requests: alles prüfen und die Images testweise bauen, aber nicht veröffentlichen
  pull_request:
    branches: [main]
  workflow_dispatch:

# bei neuen Commits im selben Pull Request den alten Lauf abbrechen
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # alle Images bauen, auch wenn eines scheitert – im Pull Request sieht man so jedes Ergebnis
      fail-fast: false
      matrix:
        include:
          - name: veloterra
            context: .
          - name: veloterra-brouter
            context: docker/brouter
          - name: veloterra-api
            context: .
            file: docker/api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          # im Pull Request nur bauen (eine Plattform, schneller), nichts veröffentlichen
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
